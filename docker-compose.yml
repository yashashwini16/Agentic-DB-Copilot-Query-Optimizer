services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copilot-postgres-vector
    restart: always
    environment:
      POSTGRES_DB: copilotdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copilotdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional Adminer UI for easy database inspection
  adminer:
    image: adminer:latest
    container_name: copilot-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pgvector_data:
